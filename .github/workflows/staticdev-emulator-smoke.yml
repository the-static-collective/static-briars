name: STATIC BRIARS — disposable Android emulator smoke

on:
  push:
    branches:
      - 'experiment/staticdev-emulator-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout attributed source and pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify source ancestry and independent development identity
        run: |
          git merge-base --is-ancestor d03d6fcd776349ec6c8b7d22035e9bb04aa1787c HEAD
          test -s LICENSE.txt
          python3 STATIC/ci/check-staticdev.py
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble both separate debug apps
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :briar-android:assembleOfficialDebug \
            :briar-android:assembleStaticdevDebug
      - name: Enable KVM for a disposable Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch both apps on an offline emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash STATIC/ci/smoke-staticdev-emulator.sh
