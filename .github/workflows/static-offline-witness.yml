name: STATIC OFFLINE WITNESS — local evidence ledger tests

on:
  push:
    branches:
      - 'experiment/offline-witness-*'
  pull_request:
    branches:
      - 'experiment/network-witness-002-android'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Check inherited source and study-only status
        run: |
          git merge-base --is-ancestor d03d6fcd776349ec6c8b7d22035e9bb04aa1787c HEAD
          test -s LICENSE.txt
          test -s STATIC/OFFLINE-FIELD-PROTOCOL-001.md
      - name: Test local-only manual field observations
        run: python3 -m unittest discover -v -s STATIC/field -p 'test_*.py'
      - name: Validate CLI syntax
        run: python3 -m py_compile STATIC/field/offline_witness.py
