name: STATIC BRIARS source-integrity witness

on:
  pull_request:
    branches: ['static/continuation-001']
  push:
    branches: ['experiment/**', 'static/continuation-001']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Preserve Briar commit ancestry, licenses and submodule gitlinks
        run: bash STATIC/ci/check-source-provenance.sh
