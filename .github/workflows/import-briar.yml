name: Import pinned Briar source history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-briar.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-briars-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'the-static-collective/static-briars'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout bootstrap control branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Import immutable source lineage (not a binary build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/import-briar.sh
